<div class="container-fluid">
  <div class="row">
    <div class="col-md-2">
      <!--Sidebar content-->

      <p>
        Search:
        <input ng-model="$ctrl.query" />
      </p>

      <p>
        Sort by:
        <select ng-model="$ctrl.orderProp">
          <option value="name">Alphabetical</option>
          <option value="age">Newest</option>
        </select>
      </p>

      <!-- Data Transfer Section -->
      <div style="margin-top: 20px; padding: 15px; background-color: #e8f4f8; border-radius: 5px; border: 2px solid #0066cc;">
        <h4 style="margin-top: 0; color: #0066cc;">📡 Data Transfer</h4>
        <p style="font-size: 13px; color: #333; font-weight: bold; margin-bottom: 10px;">Send data to Angular MFE:</p>
        <button class="btn btn-primary btn-block" ng-click="$ctrl.sendDataToAngular()"
          style="margin-bottom: 10px; font-size: 14px; padding: 10px;">
          📤 Send Data to Angular
        </button>
        <p style="font-size: 12px; color: #555; margin-bottom: 0; line-height: 1.4;">
          <em>Click to send phone list data to the Angular microfrontend.</em>
        </p>
      </div>

    </div>
    <div class="col-md-10">
      <!--Body content-->

      <!-- AngularJS Phone List -->
      <ul class="phones">
        <li ng-repeat="phone in $ctrl.phones | filter:$ctrl.query | orderBy:$ctrl.orderProp"
            class="thumbnail phone-list-item">
          <a href="#!/phones/{{phone.id}}" class="thumb">
            <img ng-src="{{phone.imageUrl}}" alt="{{phone.name}}" />
          </a>
          <a href="#!/phones/{{phone.id}}">{{phone.name}}</a>
          <p>{{phone.snippet}}</p>
          <button class="btn btn-sm btn-info" ng-click="$ctrl.sendPhoneToAngular(phone)" style="margin-top: 5px;">
            📲 Send to Angular
          </button>
        </li>
      </ul>

      <!-- Angular MFE Component Embedded Here -->
      <div id="embedded-eui-component" style="margin-top: 20px; border: 2px dashed #ccc; padding: 20px;">
        <h3>Angular MFE Component Embedded in Phone List</h3>
        <div id="eui-embedded-container"></div>
      </div>

    </div>
  </div>
</div>
