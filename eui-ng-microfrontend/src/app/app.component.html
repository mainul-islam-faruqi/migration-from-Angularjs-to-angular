<!-- Check if we're embedded in AngularJS page -->
<div *ngIf="isEmbedded()" class="embedded-mode">
    <h3>🎯 Angular Component in AngularJS Page</h3>
    <p>This proves Angular components can run inside AngularJS pages!</p>

    <!-- Simple Angular component -->
    <app-simple-phone-card [phone]="samplePhone"></app-simple-phone-card>

    <!-- EUI Angular component -->
    <app-embedded></app-embedded>
</div>

<!-- Full EUI app when not embedded -->
<eui-app *ngIf="!isEmbedded()">
    <eui-app-toolbar>
        <eui-toolbar>
            <eui-toolbar-logo />
            <eui-toolbar-app appName="appName" />
            <eui-toolbar-environment>MOCK</eui-toolbar-environment>

            <eui-toolbar-items>
                <eui-toolbar-item>
                    <eui-user-profile isShowAvatarInitials>
                        <eui-user-profile-menu>
                            <eui-user-profile-menu-item>
                                <eui-icon-svg icon="person:outline" />{{ 'eui.my-profile-informations' | translate }}
                            </eui-user-profile-menu-item>
                            <eui-user-profile-menu-item>
                                <eui-icon-svg icon="log-out:outline" />{{ 'eui.sign-out' | translate }}
                            </eui-user-profile-menu-item>
                        </eui-user-profile-menu>
                    </eui-user-profile>
                </eui-toolbar-item>

                <eui-toolbar-item>
                    <eui-notifications [count]="notificationItems?.length" [items]="notificationItems"></eui-notifications>
                </eui-toolbar-item>
            </eui-toolbar-items>

            <eui-language-selector />
        </eui-toolbar>
    </eui-app-toolbar>
    <eui-app-sidebar>
        <eui-app-sidebar-body>
            <eui-app-sidebar-menu [items]="sidebarItems" />
        </eui-app-sidebar-body>
    </eui-app-sidebar>
    <router-outlet></router-outlet>
</eui-app>
